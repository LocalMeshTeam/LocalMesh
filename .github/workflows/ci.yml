name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun ci

      - name: Build renderer and Electron process
        run: bun run build

      - name: Rebuild native modules for Electron
        run: bun run rebuild:native

      - name: Install virtual display for Electron tests
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run backend tests
        run: xvfb-run -a bun run test
