name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun ci

      - name: Build Windows installer
        run: bun run package:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalMesh-Windows
          path: release/*.exe

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME release/*.exe --title $env:GITHUB_REF_NAME --generate-notes
